<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main shape - curved design -->
  <defs>
    <linearGradient id="hudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d321a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left black curved shape -->
  <path d="M 60 40 Q 40 80 60 140 Q 80 160 100 160 L 100 40 Z" fill="#1a1a1a"/>
  
  <!-- Center green curved shape -->
  <path d="M 100 40 Q 120 60 120 120 Q 110 155 90 160 Q 100 160 120 160 Q 140 140 140 80 Q 140 40 100 40 Z" fill="#228B22"/>
  
  <!-- Right red curved shape -->
  <path d="M 120 80 Q 140 70 160 90 Q 170 120 160 160 Q 120 160 120 160 Q 140 140 140 80 Z" fill="#DC143C"/>
  
  <!-- Decorative dots -->
  <circle cx="120" cy="50" r="6" fill="#000000"/>
  <circle cx="135" cy="65" r="6" fill="#228B22"/>
  <circle cx="145" cy="95" r="6" fill="#DC143C"/>
  
  <!-- HUDUMA text -->
  <text x="180" y="90" font-size="28" font-weight="bold" fill="#1a1a1a" font-family="Arial, sans-serif" letter-spacing="1">huduma</text>
  
  <!-- KENYA text -->
  <text x="180" y="125" font-size="28" font-weight="bold" fill="#DC143C" font-family="Arial, sans-serif" letter-spacing="1">KENYA</text>
  
  <!-- Service excellence text -->
  <text x="180" y="155" font-size="11" font-style="italic" fill="#1a1a1a" font-family="Arial, sans-serif">service excellence</text>
</svg>
